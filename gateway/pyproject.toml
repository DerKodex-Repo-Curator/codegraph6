[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph-gateway"
version = "0.1.0"
description = "FastAPI gateway – public API surface for the CodeGraph multi-agent system"
requires-python = ">=3.12"
dependencies = [
    "codegraph-shared",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "mcp>=1.6.0,<2",
    "sse-starlette>=2.1,<3",
    "python-multipart>=0.0.20,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph-indexer"
version = "0.1.0"
description = "Indexer agent – clones and indexes the FastAPI repo into Neo4j"
requires-python = ">=3.12"
dependencies = [
    "codegraph-shared",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "mcp>=1.6.0,<2",
    "gitpython>=3.1,<4",
    "anthropic>=0.49.0,<1",
    "sse-starlette>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

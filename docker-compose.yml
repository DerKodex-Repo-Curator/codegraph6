version: "3.9"

# ---------------------------------------------------------------------------
# CodeGraph Multi-Agent System – Docker Compose
# ---------------------------------------------------------------------------
# Usage:
#   cp .env.example .env && nano .env   # fill in ANTHROPIC_API_KEY
#   docker compose up --build
# ---------------------------------------------------------------------------

x-common-env: &common-env
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: "true"

x-healthcheck-defaults: &hc-defaults
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:

  # -------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-password}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "512m"
      # Enable APOC for advanced queries
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./infra/neo4j/init:/var/lib/neo4j/import/init
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      start_period: 60s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./infra/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - backend

  # -------------------------------------------------------------------------
  # MCP Agents
  # -------------------------------------------------------------------------

  indexer:
    build:
      context: .
      dockerfile: agents/indexer/Dockerfile
    environment:
      <<: *common-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SERVICE_NAME: indexer
      DEFAULT_REPO_URL: ${DEFAULT_REPO_URL:-https://github.com/tiangolo/fastapi}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  graph_query:
    build:
      context: .
      dockerfile: agents/graph_query/Dockerfile
    environment:
      <<: *common-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SERVICE_NAME: graph_query
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  code_analyst:
    build:
      context: .
      dockerfile: agents/code_analyst/Dockerfile
    environment:
      <<: *common-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SERVICE_NAME: code_analyst
      MODEL: ${CODE_ANALYST_MODEL:-claude-sonnet-4-6}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: agents/orchestrator/Dockerfile
    environment:
      <<: *common-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SERVICE_NAME: orchestrator
      MODEL: ${ORCHESTRATOR_MODEL:-claude-sonnet-4-6}
      INDEXER_URL: http://indexer:8001/sse
      GRAPH_QUERY_URL: http://graph_query:8002/sse
      CODE_ANALYST_URL: http://code_analyst:8003/sse
    depends_on:
      - indexer
      - graph_query
      - code_analyst
      - redis
    networks:
      - backend
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Public-facing gateway
  # -------------------------------------------------------------------------

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: gateway
      ORCHESTRATOR_URL: http://orchestrator:8000/sse
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - orchestrator
    networks:
      - backend
      - frontend
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes & Networks
# ---------------------------------------------------------------------------

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

# Redis configuration for Oopsly conversation memory

# Persistence: RDB snapshots every 60s if ≥1 key changed
save 60 1
save 300 10

# Enable AOF for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Bind to all interfaces (Docker network only — not exposed to host in prod)
bind 0.0.0.0

# Disable protected mode (running inside Docker network)
protected-mode no

# Log to stdout for Docker log collection
loglevel notice
logfile ""

# Slow log threshold (milliseconds)
slowlog-log-slower-than 10000
slowlog-max-len 128

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph-shared"
version = "0.1.0"
description = "Shared infrastructure for the CodeGraph multi-agent system"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.7,<3",
    "neo4j>=5.28,<6",
    "redis[hiredis]>=5.2,<6",
    "structlog>=25.1,<26",
    "mcp>=1.6.0,<2",
    "anthropic>=0.49.0,<1",
    "tenacity>=9.0,<10",
    "opentelemetry-sdk>=1.31,<2",
    "opentelemetry-api>=1.31,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["codegraph_shared"]
